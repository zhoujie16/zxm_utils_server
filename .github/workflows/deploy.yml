name: Deploy CI/CD

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build admin package
        run: yarn workspace admin build

      - name: Build client package
        run: yarn workspace client build

      - name: Package admin artifact
        run: tar -czf admin.tar.gz -C apps/admin/dist .

      - name: Package client artifact
        run: tar -czf client.tar.gz -C apps/client/dist .

      - name: Upload packages to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          port: 22
          source: "admin.tar.gz,client.tar.gz"
          target: "/home/server/zxm_toolkit_admin"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          port: 22
          script: |
            set -e
            cd /home/server/zxm_toolkit_admin

            # 部署 admin 前端
            mkdir -p /www/wwwroot/w.abczzz.cn/zxm-toolkit-admin
            rm -rf /www/wwwroot/w.abczzz.cn/zxm-toolkit-admin/*
            tar -xzf admin.tar.gz -C /www/wwwroot/w.abczzz.cn/zxm-toolkit-admin
            rm -f admin.tar.gz

            # 部署 client 前端
            mkdir -p /www/wwwroot/w.abczzz.cn/zxm-toolkit-client
            rm -rf /www/wwwroot/w.abczzz.cn/zxm-toolkit-client/*
            tar -xzf client.tar.gz -C /www/wwwroot/w.abczzz.cn/zxm-toolkit-client
            rm -f client.tar.gz

            echo "✅ 前端部署完成"


